name: payment_method
description: "A new Flutter project."
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ^3.13.2

dependencies:
  cupertino_icons: ^1.0.2
  dartz: ^0.10.1
  device_preview: ^1.2.0
  dio: ^5.11.1
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  flutter_credit_card: ^4.1.0
  flutter_paypal_payment: ^1.0.7
  flutter_paytabs_bridge: ^2.7.15
  flutter_stripe: ^14.1.0
  flutter_svg: ^2.0.7
  font_awesome_flutter: ^11.0.0
  gap: ^3.0.1
  lottie: ^3.6.1
dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter:

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  assets:
    - assets/images/
    - assets/new image/
